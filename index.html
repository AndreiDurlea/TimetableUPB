<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <title>PoliTimetable</title>
    <meta name="application-name" content="PoliTimetable" />
    <meta property="og:title" content="PoliTimetable" />
    <meta property="og:site_name" content="PoliTimetable" />
    <script>
      try {
        const theme = localStorage.getItem('app_theme');
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-black w-full overflow-x-hidden m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', (e) => {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          if ('serviceWorker' in navigator && !sessionStorage.getItem('sw_recovery')) {
            sessionStorage.setItem('sw_recovery', '1');
            navigator.serviceWorker.getRegistrations().then((regs) => {
              for (const reg of regs) reg.unregister();
              caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
                .then(() => window.location.reload());
            });
          }
        }
      }, true);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          });
        });
      }
    </script>
  </body>
</html>
